name: Release Desktop

# Builds the Electron desktop app for macOS, Linux and Windows and attaches
# the installers to a GitHub Release when the `version` in
# apps/desktop/package.json changes on main. Also runnable manually.
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/package.json'
  workflow_dispatch:

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: check
        run: |
          FILE="apps/desktop/package.json"
          VERSION=$(jq -r .version "$FILE")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PREV=$(git show "HEAD^:$FILE" 2>/dev/null | jq -r .version || true)
          if [ "$VERSION" != "$PREV" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EXPO_PUBLIC_ZERODEV_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_ZERODEV_PROJECT_ID }}
      EXPO_PUBLIC_SWARMY_KEY: ${{ secrets.EXPO_PUBLIC_SWARMY_KEY }}
      EXPO_NO_TELEMETRY: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: false
      CSC_LINK: ${{ secrets.DESKTOP_MAC_CERT_P12 }}
      CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_MAC_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun --cwd apps/desktop run dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe
          if-no-files-found: error

  publish:
    needs: [guard, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ needs.guard.outputs.version }}
          name: Stage Desktop ${{ needs.guard.outputs.version }}
          files: artifacts/*
          fail_on_unmatched_files: true
