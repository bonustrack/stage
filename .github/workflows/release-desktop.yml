name: Release Desktop

# Builds the Electron desktop app for macOS (universal), Linux and Windows and
# attaches the installers plus the electron-updater manifests to the shared
# `v<version>` GitHub Release when the `version` in apps/stage/app.config.js
# changes on main (the same trigger as release-mobile.yml, so one bump releases
# every platform). Also runnable manually. See docs/desktop-release.md.
on:
  push:
    branches: [main]
    paths:
      - 'apps/stage/app.config.js'
  workflow_dispatch:

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: check
        run: |
          set -euo pipefail
          FILE="apps/stage/app.config.js"
          extract() {
            git show "$1:$FILE" 2>/dev/null \
              | grep -oE "version:[[:space:]]*['\"][^'\"]+['\"]" \
              | head -n1 \
              | sed -E "s/version:[[:space:]]*['\"]([^'\"]+)['\"]/\1/" || true
          }
          VERSION=$(extract HEAD)
          [ -n "$VERSION" ] || { echo "::error::Could not read version from $FILE"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PREV=$(extract HEAD^)
          if [ "$VERSION" != "$PREV" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "Version changed: $PREV -> $VERSION"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Version unchanged ($VERSION), skipping."
          fi

  build:
    needs: guard
    if: needs.guard.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EXPO_PUBLIC_ZERODEV_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_ZERODEV_PROJECT_ID }}
      EXPO_PUBLIC_SWARMY_KEY: ${{ secrets.EXPO_PUBLIC_SWARMY_KEY }}
      EXPO_NO_TELEMETRY: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Stamp the app version
        shell: bash
        run: |
          jq --arg v "${{ needs.guard.outputs.version }}" '.version = $v' apps/stage/desktop/package.json > pkg.tmp
          mv pkg.tmp apps/stage/desktop/package.json
      - name: Mac signing and notarization (only when the secrets are set)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT_P12: ${{ secrets.DESKTOP_MAC_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DESKTOP_MAC_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -n "$CERT_P12" ]; then
            echo "CSC_LINK=$CERT_P12" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"
          fi
          if [ -n "$CERT_P12" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_P8" ]; then
            printf '%s\n' "$ASC_P8" > "$RUNNER_TEMP/asc-api-key.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/asc-api-key.p8" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$ASC_ISSUER_ID" >> "$GITHUB_ENV"
          fi
      - run: bun run --cwd apps/stage/desktop dist
      - if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f "$RUNNER_TEMP/asc-api-key.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/stage/desktop/release/*.dmg
            apps/stage/desktop/release/*.zip
            apps/stage/desktop/release/*.AppImage
            apps/stage/desktop/release/*.deb
            apps/stage/desktop/release/*.exe
            apps/stage/desktop/release/*.blockmap
            apps/stage/desktop/release/latest*.yml
          if-no-files-found: error

  publish:
    needs: [guard, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.guard.outputs.version }}
          name: Stage v${{ needs.guard.outputs.version }}
          append_body: true
          body: |
            Desktop: macOS (`.dmg`, universal), Linux (`.AppImage`, `.deb`) and
            Windows (`.exe`). Installed apps update themselves from this release.
          files: artifacts/*
          fail_on_unmatched_files: true
