name: Publish @stage-labs/config

# Manually-triggered publish of packages/config to npm, always under the
# `beta` dist-tag.
#
# Bun builds the tarball (`bun pm pack` turns `workspace:*` ranges into real
# versions) and npm publishes it, because `bun publish` can't do npm trusted
# publishing. npm logs in with this workflow's GitHub OIDC token through the
# package's trusted publisher on npmjs.com (repository bonustrack/stage,
# workflow publish-config.yml); the package allows no publish tokens. A trusted
# publish gets an npm provenance attestation on its own: passing --provenance
# as well makes npm sign twice, and the second transparency log entry fails
# with a 409.
#
# The published version is whatever is in packages/config/package.json on the
# selected branch, so bump it there before running. npm refuses to republish
# an existing version.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (pack and check only, do not publish)
        type: boolean
        required: false
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Update npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Pack
        working-directory: packages/config
        run: bun pm pack --destination "$RUNNER_TEMP/pack"

      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: npm publish "$RUNNER_TEMP"/pack/*.tgz --tag beta --access public $DRY_RUN
