name: Publish @stage-labs/config

# Manually-triggered publish of packages/config to npm under the `beta`
# dist-tag, set up exactly like publish-kit.yml (see its header for the npm
# trusted publishing and provenance details). The package's trusted publisher
# on npmjs.com names this workflow, publish-config.yml.
#
# The published version is whatever is in packages/config/package.json on the
# selected branch, so bump it there before running. npm refuses to republish
# an existing version.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (pack and check only, do not publish)
        type: boolean
        required: false
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Update npm for trusted publishing
        run: npm install -g npm@11.21.1

      - name: Pack
        working-directory: packages/config
        run: bun pm pack --destination "$RUNNER_TEMP/pack"

      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: npm publish "$RUNNER_TEMP"/pack/*.tgz --tag beta --access public $DRY_RUN

      - name: Point latest at this release
        if: ${{ !inputs.dry_run }}
        working-directory: packages/config
        run: npm dist-tag add "$(node -p "const p = require('./package.json'); p.name + '@' + p.version")" latest
