name: App preview

# Publishes every push of every branch as an EAS Update on that branch's channel
# and links it as a dev-client deep link: in the job summary always, and as the
# "Preview" commit status (a commit status is the only GitHub mechanism with a
# custom link target; a github-actions[bot] Check Run has its details_url
# overridden). The dev-client APK must include `expo-updates` to load it.

on:
  push:
    branches: ['**', '!feat/native-mic-dictation']
  delete:

concurrency:
  group: app-preview-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Public ZeroDev client id, inlined into the bundle; without the secret the
      # preview still publishes with the smart wallet unconfigured.
      EXPO_PUBLIC_ZERODEV_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_ZERODEV_PROJECT_ID }}
      EXPO_NO_TELEMETRY: '1'
      TMPDIR: ${{ github.workspace }}/.metro-tmp
    steps:
      - uses: actions/checkout@v6

      - name: Require source CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-gate.mjs

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # TMPDIR is repointed at a workspace path (so the Metro cache survives via
      # actions/cache); create it up front so every tool that calls mkdtemp has a
      # real dir from the first step on.
      - name: Prepare temp dir
        run: mkdir -p "$TMPDIR"

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: bun-deps-hoisted-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: |
            bun-deps-hoisted-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Resolve required Android runtime
        id: native
        working-directory: apps/stage
        run: |
          set -euo pipefail
          RUNTIME="$(bunx expo-updates runtimeversion:resolve --platform android | jq -re '.runtimeVersion | strings | select(length > 0)')"
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"

      # NOTE (#437): we deliberately do NOT persist/restore the Metro transform
      # cache across runs. A stable cross-commit cache key once carried a
      # truncated/corrupt cache entry forward: it was emitted into the bundle as a
      # malformed JS array literal, which Hermes then failed to compile on-device
      # ("']' expected at end of array literal") = red-box crash on launch. The
      # source was fine; the persisted cache was poisoned and the stable key made
      # it sticky across every later commit. Correctness > the marginal export
      # speed-up: each run cold-bundles into the ephemeral TMPDIR, so a poisoned
      # entry can never survive a run or ship to a device.

      - name: Publish EAS Update for this branch
        id: update
        working-directory: apps/stage
        env:
          GIT_COMMIT: ${{ github.sha }}
          GIT_COMMIT_TIME: ${{ github.event.head_commit.timestamp }}
          RAW_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          # One EAS channel per branch, named by channelKey() in
          # apps/proxy/src/branchChannel.ts.
          BRANCH="$(bun ../../scripts/pr-preview/channel-key.mjs "$RAW_BRANCH")"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          # Per-branch, not per-commit, channels: each update's groupId already
          # makes an immutable deep link, and per-commit channels would pile up.
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          # Export first and upload with --skip-bundler: `eas update` does not
          # expose the preview-only Metro flags (Android only, no minify, no
          # Hermes bytecode).
          bunx eas-cli@20.1.0 --version &
          EAS_PID=$!
          bunx expo export \
            --platform android \
            --no-minify \
            --no-bytecode \
            --output-dir dist
          # Sanity-check the exported bundle is non-truncated before publishing
          # (#437): a poisoned/truncated bundle previously shipped a malformed JS
          # array literal that crashed Hermes on-device. node --check parse-checks
          # the bundle; a truncated file fails here and the run stops BEFORE the
          # broken update is published.
          BUNDLE="$(find dist -name '*.hbc' -o -name '*.js' | grep -E '/(_expo/static/js/android|bundles)/' | head -n1)"
          if [ -z "$BUNDLE" ]; then
            echo "::error::expo export produced no Android JS bundle" && exit 1
          fi
          node --check "$BUNDLE"
          wait "$EAS_PID"
          # Ensure a channel with the branch's name exists and points at the
          # branch (EAS links same-named channel->branch on create). Channels
          # are what u.expo.dev resolves manifests by, and bundler.stage.box/
          # <branch> proxies exactly that lookup. Idempotent: exists -> no-op.
          bunx eas-cli@20.1.0 channel:create "$BRANCH" --non-interactive > /dev/null 2>&1 \
            || true
          bunx eas-cli@20.1.0 update \
            --branch "$BRANCH" \
            --platform android \
            --skip-bundler \
            --input-dir dist \
            --message "${RAW_BRANCH}@${SHORT_SHA} (${{ github.sha }})" \
            --non-interactive --json > eas-update.json
          node ../../scripts/pr-preview/eas-deeplink.mjs eas-update.json >> "$GITHUB_OUTPUT"

      - name: Write preview deep link to job summary
        run: |
          set -euo pipefail
          MANIFEST='${{ steps.update.outputs.manifest }}'
          DEEPLINK='${{ steps.update.outputs.deeplink }}'
          BRANCH='${{ steps.update.outputs.branch }}'
          SHORT_SHA='${{ steps.update.outputs.short_sha }}'
          LAUNCHER="https://bundler.stage.box/preview-launcher.html?u=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$MANIFEST")"
          QR="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$DEEPLINK")"
          {
            echo "## App preview - \`${{ github.ref_name }}\` @ \`$SHORT_SHA\`"
            echo ""
            echo "**commit \`$SHORT_SHA\`** (\`${{ github.sha }}\`)"
            echo ""
            echo "**Required Android runtime:** \`${{ steps.native.outputs.runtime }}\`"
            echo "A dev-client APK with this exact runtime is required. An incompatible APK cannot load this OTA."
            echo ""
            echo "**Channel:** \`$BRANCH\` &nbsp;·&nbsp; **commit:** \`$SHORT_SHA\`"
            echo ""
            echo "[Open dev-client preview ($SHORT_SHA)]($LAUNCHER)"
            echo ""
            echo "Raw deep link (tap on device) - commit \`$SHORT_SHA\`:"
            echo ""
            echo "\`$DEEPLINK\`"
            echo ""
            echo "![QR]($QR)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish clickable "Preview" status
        uses: actions/github-script@v7
        with:
          script: |
            const manifest = `${{ steps.update.outputs.manifest }}`;
            const target =
              'https://bundler.stage.box/preview-launcher.html?u=' + encodeURIComponent(manifest);
            const shortSha = `${{ steps.update.outputs.short_sha }}`;
            const description = `Open dev-client preview ${shortSha} (matching runtime APK required)`;
            const status = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'Preview',
              target_url: target,
              description,
            };
            await github.rest.repos.createCommitStatus(status);
            if (context.ref === 'refs/heads/main') {
              await github.rest.repos.createCommitStatus({ ...status, context: 'Main preview' });
            }

  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Delete this branch's EAS preview channel + branch
        working-directory: apps/stage
        env:
          RAW_BRANCH: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          BRANCH="$(bun ../../scripts/pr-preview/channel-key.mjs "$RAW_BRANCH")"
          echo "Tearing down EAS preview for branch '$RAW_BRANCH' -> '$BRANCH'"
          bunx eas-cli@20.1.0 channel:delete "$BRANCH" --non-interactive || \
            echo "No EAS channel '$BRANCH' to delete (or already gone)."
          bunx eas-cli@20.1.0 branch:delete "$BRANCH" --non-interactive || \
            echo "No EAS branch '$BRANCH' to delete (or already gone)."
