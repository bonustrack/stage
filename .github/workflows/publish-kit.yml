name: Publish @stage-labs/kit

# Manually-triggered publish of packages/kit to npm under the `beta`
# dist-tag. A real publish then points `latest` at the same version, since
# every release is a beta and `latest` would otherwise stay on an old one.
#
# Bun builds the tarball (`bun pm pack` turns `workspace:*` ranges into real
# versions) and npm publishes it, because `bun publish` can't do npm trusted
# publishing. npm logs in with this workflow's GitHub OIDC token through the
# package's trusted publisher on npmjs.com (repository bonustrack/stage,
# workflow publish-kit.yml, environment npm, allowed to publish and to manage
# dist-tags); the package allows no publish tokens. The npm environment only
# deploys from main, so a run from any other branch can't get an npm login. A trusted
# publish gets an npm provenance attestation on its own: passing --provenance
# as well makes npm sign twice, and the second transparency log entry fails
# with a 409.
#
# The published version is whatever is in packages/kit/package.json on the
# selected branch, so bump it there before running. npm refuses to republish
# an existing version.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (pack and check only, do not publish)
        type: boolean
        required: false
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Update npm for trusted publishing
        run: npm install -g npm@11.21.1

      - name: Pack
        working-directory: packages/kit
        run: bun pm pack --destination "$RUNNER_TEMP/pack"

      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: npm publish "$RUNNER_TEMP"/pack/*.tgz --tag beta --access public $DRY_RUN

      - name: Point latest at this release
        if: ${{ !inputs.dry_run }}
        working-directory: packages/kit
        run: npm dist-tag add "$(node -p "const p = require('./package.json'); p.name + '@' + p.version")" latest
