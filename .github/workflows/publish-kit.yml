name: Publish @stage-labs/kit

# Manually-triggered publish of packages/kit to npm, always under the
# `beta` dist-tag. A trusted publish also gets an npm provenance attestation,
# which npm creates on its own: passing --provenance as well makes it sign twice
# and the second transparency log entry fails with a 409.
#
# Bun builds the tarball (`bun pm pack` turns `workspace:*` ranges into real
# versions) and npm publishes it, because `bun publish` can't do provenance or
# npm trusted publishing. npm authenticates with this workflow's GitHub OIDC
# token once packages/kit has a trusted publisher on npmjs.com (repository
# bonustrack/stage, workflow publish-kit.yml), and falls back to the
# `NPM_TOKEN` repository secret until then. After the first trusted publish,
# disallow token publishing for the package on npmjs.com and delete the secret.
#
# The published version is whatever is in packages/kit/package.json on the
# selected branch, so bump it there before running. npm refuses to republish
# an existing version.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (pack and check only, do not publish)
        type: boolean
        required: false
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Pack
        working-directory: packages/kit
        run: bun pm pack --destination "$RUNNER_TEMP/pack"

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: npm publish "$RUNNER_TEMP"/pack/*.tgz --tag beta --access public $DRY_RUN
