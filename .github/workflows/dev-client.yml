name: Dev client APK

# Android dev-client build (EAS `development` profile), keyed by the native
# runtime (the Expo fingerprint, the app's runtimeVersion). An APK of a runtime
# loads every JS-OTA preview of that runtime (pr-preview.yml), so each runtime
# is built once, and each build consumes one EAS build slot.
#
# Every push to main resolves main's runtime. When no APK on the `dev-client`
# release was built for it (any commit, any branch, found through EAS), it
# builds one. A push that changes only JS builds nothing. The rolling
# stage-dev-client.apk then follows main's runtime: the new build, or the
# runtime's existing APK.
#
# Other branches build on demand: `Actions -> Dev client APK -> Run workflow`
# on the branch. `publish_rolling` also points the rolling APK at its runtime.
#
# The APK is checked with scripts/verify-apk.mjs (v2 signature, package,
# versionCode, signing certificate, packaged runtime, commit) and published as a
# direct download on the `dev-client` GitHub release, named after the commit:
#   releases/download/dev-client/stage-dev-client-<sha7>.apk
# Other assets are never deleted.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_rolling:
        description: Also point the rolling stage-dev-client.apk at this runtime's APK
        type: boolean
        default: false

concurrency:
  group: dev-client-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: dev-client

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      EXPO_NO_TELEMETRY: '1'
      PACKAGE: box.metro.monitor
      SIGNING_CERT_SHA256: 96951d975d57446c655fcadae9117bdf1a00f72eb6882ff72cef1a836c2ad096
      ROLLING: ${{ github.event_name == 'push' || inputs.publish_rolling }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Look for an APK of this runtime
        id: asset
        working-directory: apps/stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUNTIME="$(bunx expo-updates runtimeversion:resolve --platform android | jq -re .runtimeVersion)"
          ASSETS="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '[.assets[] | {name, digest}]')"
          BUILT="$(eas build:list --platform android --build-profile development --runtime-version "$RUNTIME" \
            --status finished --limit 50 --json --non-interactive | jq -r '.[].gitCommitHash // empty')"
          digest() { jq -r --arg name "$1" '.[] | select(.name == $name) | .digest // "none"' <<< "$ASSETS"; }
          ROLLING_DIGEST="$(digest stage-dev-client.apk)"
          APK=""
          ROLLING_CURRENT=false
          for SHA in "$GITHUB_SHA" $BUILT; do
            NAME="stage-dev-client-${SHA::7}.apk"
            DIGEST="$(digest "$NAME")"
            [ -n "$DIGEST" ] || continue
            [ -n "$APK" ] || APK="$NAME"
            if [ "$DIGEST" != none ] && [ "$DIGEST" = "$ROLLING_DIGEST" ]; then ROLLING_CURRENT=true; fi
          done
          BUILD=false
          if [ -z "$APK" ]; then BUILD=true; APK="stage-dev-client-${GITHUB_SHA::7}.apk"; fi
          PUBLISH_ROLLING=false
          if [ "$ROLLING" = true ] && [ "$ROLLING_CURRENT" = false ]; then PUBLISH_ROLLING=true; fi
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$APK"
          echo "Runtime $RUNTIME, APK $APK, build $BUILD, rolling $PUBLISH_ROLLING"
          {
            echo "runtime=$RUNTIME"
            echo "apk=$APK"
            echo "url=$URL"
            echo "build=$BUILD"
            echo "rolling=$PUBLISH_ROLLING"
          } >> "$GITHUB_OUTPUT"
          if [ "$BUILD" = false ]; then
            {
              echo "## Dev-client APK - \`$GITHUB_REF_NAME\` @ \`${GITHUB_SHA::7}\`"
              echo ""
              echo "Runtime \`$RUNTIME\` already has its APK, no new build: [Download APK]($URL)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build dev-client APK on EAS
        if: steps.asset.outputs.build == 'true'
        working-directory: apps/stage
        env:
          APK: ${{ steps.asset.outputs.apk }}
        run: |
          set -euo pipefail
          eas build -p android --profile development --non-interactive --json --wait > "$RUNNER_TEMP/eas-build.json"
          cat "$RUNNER_TEMP/eas-build.json"
          URL=$(jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl // empty' "$RUNNER_TEMP/eas-build.json")
          [ -n "$URL" ] || { echo "::error::No Android artifact URL from EAS"; exit 1; }
          curl -fSL "$URL" -o "$GITHUB_WORKSPACE/$APK"

      - name: Verify the APK
        if: steps.asset.outputs.build == 'true'
        id: verify
        env:
          APK: ${{ steps.asset.outputs.apk }}
          RUNTIME: ${{ steps.asset.outputs.runtime }}
        run: |
          set -euo pipefail
          VERSION_CODE=$(jq -r '.[0].appBuildVersion // empty' "$RUNNER_TEMP/eas-build.json")
          [ -n "$VERSION_CODE" ] || { echo "::error::EAS output has no versionCode"; exit 1; }
          bun scripts/verify-apk.mjs "$APK" \
            --package "$PACKAGE" \
            --cert "$SIGNING_CERT_SHA256" \
            --commit "$GITHUB_SHA" \
            --version-code "$VERSION_CODE" \
            --runtime "$RUNTIME"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Publish the APK on the dev-client release
        if: steps.asset.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.asset.outputs.apk }}
          APK_URL: ${{ steps.asset.outputs.url }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$APK" --repo "$GITHUB_REPOSITORY"
          curl -fsSIL -o /dev/null "$APK_URL"

      - name: Write install link to job summary
        if: steps.asset.outputs.build == 'true'
        env:
          APK_URL: ${{ steps.asset.outputs.url }}
          RUNTIME: ${{ steps.asset.outputs.runtime }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
        run: |
          set -euo pipefail
          QR="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$APK_URL")"
          {
            echo "## Dev-client APK - \`$GITHUB_REF_NAME\` @ \`${GITHUB_SHA::7}\`"
            echo ""
            echo "[Download APK]($APK_URL) (open on the phone, then install)"
            echo ""
            echo "Runtime \`$RUNTIME\`, versionCode $VERSION_CODE."
            echo ""
            echo "![QR]($QR)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Point the rolling dev-client APK at this runtime's APK
        if: steps.asset.outputs.rolling == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.asset.outputs.apk }}
          BUILD: ${{ steps.asset.outputs.build }}
        run: |
          set -euo pipefail
          if [ "$BUILD" = true ]; then
            cp "$APK" stage-dev-client.apk
          else
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$APK" --output stage-dev-client.apk
          fi
          gh release upload "$RELEASE_TAG" stage-dev-client.apk --clobber --repo "$GITHUB_REPOSITORY"
          echo "Rolling stage-dev-client.apk is now $APK." >> "$GITHUB_STEP_SUMMARY"
