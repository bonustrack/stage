name: Deploy proxy worker

# Deploys apps/proxy (proxy.stage.box + bundler.stage.box) with wrangler whenever
# the worker's source or this file changes on main, or on demand. Needs the
# CLOUDFLARE_API_TOKEN repository secret: a token created from the
# "Edit Cloudflare Workers" template, scoped to the bonustrack account and the
# stage.box zone. The account id is public and pinned below so wrangler does
# not have to guess it from the token.

on:
  push:
    branches: [main]
    paths:
      - 'apps/proxy/**'
      - '.github/workflows/deploy-proxy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-proxy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d6eaff079ffb6a7660165d8b4350341a
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - run: bun install --frozen-lockfile

      - name: Typecheck and test the worker
        working-directory: apps/proxy
        run: |
          set -euo pipefail
          bunx tsc --noEmit
          bun test test/

      - name: Deploy with wrangler
        working-directory: apps/proxy
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is not set; add it in the repository settings." >&2
            exit 1
          fi
          bunx wrangler deploy
