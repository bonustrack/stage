name: Release Stage

# Builds the Stage (prod) variant for Android (APK) + iOS and publishes the
# artifacts to a GitHub Release when the `version` in apps/stage/app.config.js
# changes on main. The same bump drives play-release.yml, so one version change
# ships the Play store bundle and the sideloadable APK together. Also runnable
# manually via workflow_dispatch.
on:
  push:
    branches: [main]
    paths:
      - 'apps/stage/app.config.js'
  workflow_dispatch:

# Avoid double-building on overlapping pushes.
concurrency:
  group: release-stage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: check
        run: |
          FILE="apps/stage/app.config.js"
          extract() {
            git show "$1:$FILE" 2>/dev/null \
              | grep -oE "version:[[:space:]]*['\"][^'\"]+['\"]" \
              | head -n1 \
              | sed -E "s/version:[[:space:]]*['\"]([^'\"]+)['\"]/\1/" || true
          }
          VERSION=$(extract HEAD)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from $FILE"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Manual runs always proceed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — building v$VERSION"
            exit 0
          fi
          PREV=$(extract HEAD^)
          if [ "$VERSION" != "$PREV" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: $PREV -> $VERSION"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($VERSION) — skipping build."
          fi

  android:
    needs: guard
    if: needs.guard.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: prod
    outputs:
      apk: ${{ steps.build.outputs.apk }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - id: build
        working-directory: apps/stage
        run: |
          # preview-prod = release APK (Stage variant) per eas.json.
          # NOTE: EAS free tier has a monthly cloud-build cap; cloud builds may
          # queue or be rejected if the cap is hit.
          OUT=$(eas build -p android --profile preview-prod --non-interactive --json --wait)
          echo "$OUT"
          URL=$(echo "$OUT" | jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "No artifact URL from EAS"; exit 1
          fi
          curl -fSL "$URL" -o "$GITHUB_WORKSPACE/stage.apk"
          echo "apk=stage.apk" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: stage.apk

  ios:
    needs: guard
    if: needs.guard.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # iOS requires Apple Developer credentials configured in EAS
    # (`eas credentials`) and a paid Apple Developer account. If those aren't
    # set up this step fails — continue-on-error keeps the Android release alive.
    continue-on-error: true
    env:
      APP_VARIANT: prod
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - working-directory: apps/stage
        run: |
          OUT=$(eas build -p ios --profile preview-prod --non-interactive --json --wait)
          echo "$OUT"
          URL=$(echo "$OUT" | jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "No iOS artifact URL from EAS"; exit 1
          fi
          curl -fSL "$URL" -o "$GITHUB_WORKSPACE/stage.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: stage.ipa
          if-no-files-found: ignore

  testers:
    # Hands the same APK to the whitelisted tester group through Firebase App
    # Distribution, so people can install it without the Play store. Needs the
    # FIREBASE_APP_DISTRIBUTION_SA_JSON secret: a Firebase service account key
    # with the "Firebase App Distribution Admin" role on project metro-e47f6.
    needs: [guard, android]
    if: needs.guard.outputs.changed == 'true' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    env:
      SA_JSON: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SA_JSON }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts
      - name: Distribute to testers
        run: |
          set -euo pipefail
          if [ -z "${SA_JSON}" ]; then
            echo "::warning::FIREBASE_APP_DISTRIBUTION_SA_JSON is not set; skipping tester distribution."
            exit 0
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@14 appdistribution:distribute artifacts/stage.apk \
            --app 1:163881755635:android:d88662b6bbcd166a7da886 \
            --groups testers \
            --release-notes "Stage v${{ needs.guard.outputs.version }} (${{ github.sha }})"
          rm -f "$RUNNER_TEMP/firebase-sa.json"

  release:
    needs: [guard, android, ios]
    if: needs.guard.outputs.changed == 'true' && !cancelled() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts
      # iOS may not exist (continue-on-error); don't fail if missing.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-ipa
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.guard.outputs.version }}
          name: Stage v${{ needs.guard.outputs.version }}
          prerelease: false
          body: |
            Stage v${{ needs.guard.outputs.version }} for Android (`box.stage`).
            Install the APK directly, or get it from Google Play once the store
            release is approved. Commit: ${{ github.sha }}
          files: |
            artifacts/*.apk
            artifacts/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
