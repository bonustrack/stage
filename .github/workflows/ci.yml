name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Knip (unused files/deps/exports)
        run: bun run knip
      - name: Madge (circular dependencies)
        run: bun run madge
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test
