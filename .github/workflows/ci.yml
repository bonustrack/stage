name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-android-recording-54
  cancel-in-progress: false

jobs:
  expo-recording-launcher:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/android-recording-54-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BROWSER: none
      NODE_OPTIONS: --max-old-space-size=1500
      EXPO_NO_TELEMETRY: '1'
      APP_VARIANT: prod
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Prepare pinned normal EAS tooling without credentials
        run: |
          set -euo pipefail
          test "$(bun --version)" = '1.4.0'
          bun install --frozen-lockfile
          bunx eas-cli@25.1.1 --version
      - name: Verify existing connection and launch at most one bounded EAS attempt
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node ci/android-demo/eas-launcher.mjs
