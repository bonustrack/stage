name: CI

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: isolated-android-recording-54
  cancel-in-progress: false

jobs:
  android-recording:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/android-recording-54-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BROWSER: none
      NODE_OPTIONS: --max-old-space-size=1500
      EXPO_NO_TELEMETRY: '1'
      GH_TOKEN: ${{ github.token }}
      DEMO_RECIPIENT: MCowBQYDK2VuAyEAysXQMsqyYvFaDpyDsevgKKmovlsIMmH1IWyRCDWbdn4=
    steps:
      - name: Verify existing acceleration without permission changes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export DEMO_ROOT="$RUNNER_TEMP/stage-recording-54"
          mkdir "$DEMO_ROOT"
          printf 'DEMO_ROOT=%s\n' "$DEMO_ROOT" >> "$GITHUB_ENV"
          for FILE in preflight.py session.py private-evidence.mjs; do
            gh api "repos/$GITHUB_REPOSITORY/contents/ci/android-demo/$FILE?ref=$GITHUB_SHA" --jq .content | base64 --decode > "$DEMO_ROOT/$FILE"
          done
          printf '%s' "$DEMO_RECIPIENT" | base64 --decode > "$DEMO_ROOT/recipient.der"
          python3 "$DEMO_ROOT/preflight.py"
      - name: Controlled private audio and Android test session
        shell: bash
        run: python3 "$DEMO_ROOT/session.py"
