name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Knip (unused files/deps/exports)
        run: bun run knip
      - name: Madge (circular dependencies)
        run: bun run madge
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test

  android-compile:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/native-mic-dictation'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      BROWSER: none
      NODE_OPTIONS: --max-old-space-size=1500
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Generate Android app
        working-directory: apps/stage
        run: bunx expo prebuild --platform android --no-install
      - name: Verify Android toolchain
        working-directory: apps/stage/android
        run: java -version && ./gradlew --version
      - name: Compile Android app
        working-directory: apps/stage/android
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a \
            --no-daemon --max-workers=2 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-compile-log
          path: ${{ runner.temp }}/android-build.log
          if-no-files-found: ignore
          retention-days: 7
