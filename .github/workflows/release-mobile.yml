name: Release Mobile

# One version-driven release for both stores. When the `version` value in
# apps/stage/app.config.js changes on main (or on manual dispatch):
#   android-store : EAS cloud build (production-prod, AAB) -> eas submit to the
#                   Play internal + closed tracks; production is allowed to fail
#                   while the Play account gate is in place.
#   android-apk   : EAS cloud build (preview-prod, APK) -> GitHub Release asset
#                   and Firebase App Distribution for the `testers` group.
#   ios           : EAS cloud build (production-prod) -> eas submit to TestFlight.
#                   EAS creates/reuses the distribution certificate and profile
#                   from the App Store Connect API key, so no Xcode or macOS
#                   runner is involved. Skips itself until the Apple secrets exist.
# See docs/mobile-release.md for the secrets and the one-time Apple setup.
on:
  push:
    branches: [main]
    paths:
      - 'apps/stage/app.config.js'
  workflow_dispatch:
    inputs:
      platform:
        description: 'What to release'
        type: choice
        default: all
        options: [all, android, ios]

concurrency:
  group: release-mobile-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_VARIANT: prod
  EXPO_NO_TELEMETRY: '1'

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
      android: ${{ steps.check.outputs.android }}
      ios: ${{ steps.check.outputs.ios }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: check
        run: |
          set -euo pipefail
          FILE="apps/stage/app.config.js"
          extract() {
            git show "$1:$FILE" 2>/dev/null \
              | grep -oE "version:[[:space:]]*['\"][^'\"]+['\"]" \
              | head -n1 \
              | sed -E "s/version:[[:space:]]*['\"]([^'\"]+)['\"]/\1/" || true
          }
          VERSION=$(extract HEAD)
          [ -n "$VERSION" ] || { echo "::error::Could not read version from $FILE"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          echo "android=$([ "$PLATFORM" != ios ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ios=$([ "$PLATFORM" != android ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PREV=$(extract HEAD^)
          if [ "$VERSION" != "$PREV" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "Version changed: $PREV -> $VERSION"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Version unchanged ($VERSION), skipping."
          fi

  android-store:
    needs: guard
    if: needs.guard.outputs.changed == 'true' && needs.guard.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/stage
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: bun install --frozen-lockfile
        working-directory: .
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Write Play service account key
        env:
          SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [ -n "$SA_JSON" ] || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set"; exit 1; }
          printf '%s' "$SA_JSON" > play-service-account.json
      - name: Build (EAS, production-prod)
        id: build
        run: |
          OUT=$(eas build -p android --profile production-prod --non-interactive --json --wait)
          echo "$OUT"
          echo "id=$(echo "$OUT" | jq -r '.[0].id')" >> "$GITHUB_OUTPUT"
      - name: Submit to Play internal
        run: eas submit -p android --profile internal --id "${{ steps.build.outputs.id }}" --non-interactive
      - name: Submit to Play closed
        run: eas submit -p android --profile closed --id "${{ steps.build.outputs.id }}" --non-interactive
      - name: Submit to Play production
        continue-on-error: true
        run: eas submit -p android --profile production --id "${{ steps.build.outputs.id }}" --non-interactive
      - if: always()
        run: rm -f play-service-account.json

  android-apk:
    needs: guard
    if: needs.guard.outputs.changed == 'true' && needs.guard.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Build (EAS, preview-prod APK)
        working-directory: apps/stage
        run: |
          OUT=$(eas build -p android --profile preview-prod --non-interactive --json --wait)
          echo "$OUT"
          URL=$(echo "$OUT" | jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl')
          [ -n "$URL" ] && [ "$URL" != null ] || { echo "::error::No APK URL from EAS"; exit 1; }
          curl -fSL "$URL" -o "$GITHUB_WORKSPACE/stage.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: stage.apk

  ios:
    needs: guard
    if: needs.guard.outputs.changed == 'true' && needs.guard.outputs.ios == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/stage
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE || 'INDIVIDUAL' }}
    steps:
      - name: Check Apple secrets
        id: apple
        env:
          P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_API_KEY_ID" ] || [ -z "$ASC_API_KEY_ISSUER_ID" ] || [ -z "$P8" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_APP_ID" ]; then
            echo "::warning::Apple secrets missing (ASC_API_KEY_ID, ASC_API_KEY_ISSUER_ID, ASC_API_KEY_P8, APPLE_TEAM_ID, ASC_APP_ID); skipping iOS."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - uses: actions/checkout@v6
        if: steps.apple.outputs.ready == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.apple.outputs.ready == 'true'
        with:
          bun-version: 1.3.9
      - uses: expo/expo-github-action@v8
        if: steps.apple.outputs.ready == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: bun install --frozen-lockfile
        if: steps.apple.outputs.ready == 'true'
        working-directory: .
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Write App Store Connect API key and submit settings
        if: steps.apple.outputs.ready == 'true'
        env:
          P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s\n' "$P8" > asc-api-key.p8
          jq --arg key "$ASC_API_KEY_ID" --arg issuer "$ASC_API_KEY_ISSUER_ID" --arg team "$APPLE_TEAM_ID" --arg app "$ASC_APP_ID" \
            '.submit.production.ios += { ascApiKeyId: $key, ascApiKeyIssuerId: $issuer, appleTeamId: $team, ascAppId: $app }' \
            eas.json > eas.tmp.json && mv eas.tmp.json eas.json
      - name: Build (EAS, production-prod)
        if: steps.apple.outputs.ready == 'true'
        id: build
        env:
          EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/apps/stage/asc-api-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE || 'INDIVIDUAL' }}
        run: |
          OUT=$(eas build -p ios --profile production-prod --non-interactive --json --wait)
          echo "$OUT"
          echo "id=$(echo "$OUT" | jq -r '.[0].id')" >> "$GITHUB_OUTPUT"
      - name: Submit to TestFlight
        if: steps.apple.outputs.ready == 'true'
        run: eas submit -p ios --profile production --id "${{ steps.build.outputs.id }}" --non-interactive
      - if: always()
        run: rm -f asc-api-key.p8 && git checkout -- eas.json

  testers:
    needs: [guard, android-apk]
    if: needs.guard.outputs.changed == 'true' && needs.android-apk.result == 'success'
    runs-on: ubuntu-latest
    env:
      SA_JSON: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SA_JSON }}
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts
      - name: Distribute to the testers group
        run: |
          set -euo pipefail
          if [ -z "${SA_JSON}" ]; then
            echo "::warning::FIREBASE_APP_DISTRIBUTION_SA_JSON is not set; skipping tester distribution."
            exit 0
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          bunx firebase-tools@14 appdistribution:distribute artifacts/stage.apk \
            --app 1:163881755635:android:d88662b6bbcd166a7da886 \
            --groups testers \
            --release-notes "Stage v${{ needs.guard.outputs.version }} (${{ github.sha }})"
          rm -f "$RUNNER_TEMP/firebase-sa.json"

  github-release:
    needs: [guard, android-apk]
    if: needs.guard.outputs.changed == 'true' && needs.android-apk.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.guard.outputs.version }}
          name: Stage v${{ needs.guard.outputs.version }}
          append_body: true
          body: |
            Android: install the `.apk` directly, or get it from Google Play once
            the store release is approved. iOS ships through TestFlight.
            Commit: ${{ github.sha }}
          files: artifacts/*.apk
