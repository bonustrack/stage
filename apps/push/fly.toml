app = "stage-push"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  API_PORT = "8080"
  LOG_ENCODING = "json"
  LOG_LEVEL = "info"
  LISTENER_TYPE = "v3"
  XMTP_GRPC_ADDRESS = "production.xmtp.network:5556"
  XMTP_LISTENER_TLS = "true"
  FCM_PROJECT_ID = "metro-e47f6"
  APNS_TOPIC = "box.stage"
  APNS_MODE = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/readyz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
