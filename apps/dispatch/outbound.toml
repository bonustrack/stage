name = "nodes-outbound"
main = "src/outbound.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = false

# With an Outbound Worker attached, nodes can not open raw TCP sockets, and
# global_fetch_strictly_public sends every request through Cloudflare's front
# door, like any outside client.

[observability]
enabled = false
