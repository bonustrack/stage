name = "proxy"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# Both hostnames need proxied (orange-cloud) DNS records in the stage.box zone
# so the Worker routes intercept at the edge.
#
# proxy.stage.box: link-preview / image-resize / x402 endpoints for the app
# (record: AAAA 100:: proxied - the Worker answers before any origin).
#
# bundler.stage.box: /<branch> proxies the EAS Update manifest for that
# branch's channel so the expo dev client loads previews from a stable
# per-branch URL; browsers on other paths fall through to the GitHub Pages
# origin (dev hub + launcher), so its record stays a proxied CNAME to
# bonustrack.github.io.
routes = [{ pattern = "proxy.stage.box/*", zone_name = "stage.box" }, { pattern = "bundler.stage.box/*", zone_name = "stage.box" }]

# Records which address claimed which *.stage.base.eth name (one per address).
# The operator key that creates the names lives in the NAMES_OPERATOR_KEY secret.
[[kv_namespaces]]
binding = "NAMES_KV"
id = "c02f6c676fb6486b9da51188fa61c7fa"

# Every claim runs inside this one Durable Object, one at a time, so two
# people can never reserve the same label or give one address two names.
# Its storage is the source of truth for reservations; KV mirrors it for
# the read endpoints (status, check, resolve).
[[durable_objects.bindings]]
name = "NAMES_CLAIMS"
class_name = "NamesClaims"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NamesClaims"]

# Encrypted XMTP history-sync archives, one object per upload (see README.md).
[[durable_objects.bindings]]
name = "HISTORY_ARCHIVES"
class_name = "HistoryArchives"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["HistoryArchives"]

# History by transfer code was removed (XMTP device sync replaces it). The v3
# class stays in the migration history; v5 deletes it with its storage.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["HistoryTransfers"]

# st.box mail (receive only), one object per mailbox (see README.md).
[[durable_objects.bindings]]
name = "MAIL_BOXES"
class_name = "MailBoxes"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["MailBoxes"]

[[migrations]]
tag = "v5"
deleted_classes = ["HistoryTransfers"]

# Workers Logs stay off: an invocation log would keep every attachment id and
# client IP for days.
[observability]
enabled = false

# Encrypted chat attachments, ciphertext only (see README.md).
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "stage"

# Attachment uploads per client IP, enforced across the whole edge.
[[ratelimits]]
name = "ATTACHMENT_UPLOADS"
namespace_id = "1081"
simple = { limit = 20, period = 60 }

# Mail API calls (key, sign-in, list, fetch) per client IP.
[[ratelimits]]
name = "MAIL_REQUESTS"
namespace_id = "1080"
simple = { limit = 30, period = 60 }

# User node publishes per client IP. /nodes also needs the NODES_CF_API_TOKEN
# and NODES_CF_ACCOUNT_ID secrets, set in the dashboard.
[[ratelimits]]
name = "NODE_PUBLISHES"
namespace_id = "1082"
simple = { limit = 10, period = 60 }

# All node publishes together, a ceiling per location for the Cloudflare API
# budget of NODES_CF_API_TOKEN.
[[ratelimits]]
name = "NODE_PUBLISHES_ALL"
namespace_id = "1084"
simple = { limit = 60, period = 60 }
