name = "proxy"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# Both hostnames need proxied (orange-cloud) DNS records in the stage.box zone
# so the Worker routes intercept at the edge.
#
# proxy.stage.box: link-preview / image-resize / x402 endpoints for the app
# (record: AAAA 100:: proxied - the Worker answers before any origin).
#
# bundler.stage.box: /<branch> proxies the EAS Update manifest for that
# branch's channel so the expo dev client loads previews from a stable
# per-branch URL; all other paths fall through to the GitHub Pages origin
# (dev hub + launcher), so its record stays a proxied CNAME to
# bonustrack.github.io.
routes = [
  { pattern = "proxy.stage.box/*", zone_name = "stage.box" },
  { pattern = "bundler.stage.box/*", zone_name = "stage.box" },
]

# Records which address claimed which *.stage.base.eth name (one per address).
# The operator key that creates the names lives in the NAMES_OPERATOR_KEY secret.
[[kv_namespaces]]
binding = "NAMES_KV"
id = "c02f6c676fb6486b9da51188fa61c7fa"

# Every claim runs inside this one Durable Object, one at a time, so two
# people can never reserve the same label or give one address two names.
# Its storage is the source of truth for reservations; KV mirrors it for
# the read endpoints (status, check, resolve).
[[durable_objects.bindings]]
name = "NAMES_CLAIMS"
class_name = "NamesClaims"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NamesClaims"]

# Encrypted XMTP history-sync archives, one object per upload, deleted by an
# alarm three days later. The app's devices upload to /xmtp-history/*/upload
# and download from /xmtp-history/*/files/<id>; the AES key only travels
# inside the MLS device-sync group, so the Worker stores opaque ciphertext.
[[durable_objects.bindings]]
name = "HISTORY_ARCHIVES"
class_name = "HistoryArchives"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["HistoryArchives"]

# History handed to another device with a transfer code (Settings > Messenger >
# Send history). The app derives the lookup id and the archive key from the
# code with PBKDF2, so the Worker only sees an opaque id and ciphertext. One
# object per transfer at /xmtp-history/*/transfer/<id>: PUT once, GET at most
# three times, DELETE after a successful import, alarm-deleted after 24 hours.
[[durable_objects.bindings]]
name = "HISTORY_TRANSFERS"
class_name = "HistoryTransfers"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["HistoryTransfers"]

# Transfer lookups (GET/DELETE) per client IP, to make guessing codes online
# pointless on top of their 50 bits of entropy.
[[ratelimits]]
name = "TRANSFER_LOOKUPS"
namespace_id = "2419"
simple = { limit = 10, period = 60 }
